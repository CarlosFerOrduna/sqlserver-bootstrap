services:
  mssql:
    # Pinned: healthcheck and restore-db.sh need /opt/mssql-tools18/bin/sqlcmd.
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./baks:/var/opt/mssql/backup
      - mssql_data:/var/opt/mssql
    environment:
      MSSQL_SA_PASSWORD: "${DB_PASS}"
      ACCEPT_EULA: "Y"
    ports:
      - "${DB_PORT:-1433}:1433"
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U "${DB_USER}" -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  restore-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      mssql:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./baks:/var/opt/mssql/backup
      - ./scripts/restore-db.sh:/restore-db.sh:ro
    command: ["bash", "/restore-db.sh"]
    restart: no

volumes:
  mssql_data:
